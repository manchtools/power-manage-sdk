syntax = "proto3";

package pm.v1;

import "google/protobuf/duration.proto";
import "pm/v1/actions.proto";
import "pm/v1/common.proto";

option go_package = "github.com/manchtools/power-manage-sdk/gen/go/pm/v1;pmv1";

// ============================================================================
// Agent Service
// ============================================================================

service AgentService {
  // Bidirectional stream for agent-server communication
  rpc Stream(stream AgentMessage) returns (stream ServerMessage);

  // Sync assigned actions (called by agent after successful connection)
  // Returns all actions currently assigned to the device for local storage
  rpc SyncActions(SyncActionsRequest) returns (SyncActionsResponse);

  // Validate a one-time LUKS token and return action details + complexity requirements
  // Used by the CLI subcommand (power-manage-agent luks set-passphrase --token <token-value>)
  rpc ValidateLuksToken(ValidateLuksTokenRequest) returns (ValidateLuksTokenResponse);
}

// ============================================================================
// Agent -> Server
// ============================================================================

message AgentMessage {
  // @gotags: validate:"required,ulid"
  string id = 1;

  oneof payload {
    // @gotags: validate:"omitempty"
    Hello hello = 10;
    // @gotags: validate:"omitempty"
    Heartbeat heartbeat = 11;
    // @gotags: validate:"omitempty"
    ActionResult action_result = 20;
    // @gotags: validate:"omitempty"
    OutputChunk output_chunk = 21;
    // @gotags: validate:"omitempty"
    OSQueryResult query_result = 30;
    // @gotags: validate:"omitempty"
    DeviceInventory inventory = 31;
    // @gotags: validate:"omitempty"
    SecurityAlert security_alert = 40;
    // LUKS key management (via stream, not separate RPCs)
    // @gotags: validate:"omitempty"
    GetLuksKeyRequest get_luks_key = 50;
    // @gotags: validate:"omitempty"
    StoreLuksKeyRequest store_luks_key = 51;
    // @gotags: validate:"omitempty"
    RevokeLuksDeviceKeyResult revoke_luks_device_key_result = 52;
    // LPS password rotations. Spec 41 moved this onto the stream: it used to
    // reach control through InternalService/ProxyStoreLpsPasswords, i.e. the
    // gateway relayed the batch. LUKS was already a stream message; LPS was not,
    // purely because it went via the proxy. With the proxy deleted the agent
    // reports rotations the same way it reports everything else.
    // @gotags: validate:"omitempty"
    StoreLpsPasswordsRequest store_lps_passwords = 53;
    // Log query result (journalctl output)
    // @gotags: validate:"omitempty"
    LogQueryResult log_query_result = 60;
    // Remote terminal (PTY) session messages
    // @gotags: validate:"omitempty"
    TerminalOutput terminal_output = 70;
    // @gotags: validate:"omitempty"
    TerminalStateChange terminal_state_change = 71;
  }
}

// ============================================================================
// Output Streaming
// ============================================================================

// Output stream type for stdout/stderr differentiation
enum OutputStreamType {
  OUTPUT_STREAM_TYPE_UNSPECIFIED = 0;
  OUTPUT_STREAM_TYPE_STDOUT = 1;
  OUTPUT_STREAM_TYPE_STDERR = 2;
}

// Output chunk sent during action execution (Agent -> Server)
message OutputChunk {
  // @gotags: validate:"required,ulid"
  string execution_id = 1;
  // @gotags: validate:"required,ne=0"
  OutputStreamType stream = 2;
  // @gotags: validate:"required,max=65536"
  bytes data = 3;
  // @gotags: validate:"gte=0"
  int64 sequence = 4;
}

message Hello {
  // @gotags: validate:"required"
  DeviceId device_id = 1;
  // @gotags: validate:"required,min=1,max=32"
  string agent_version = 2;
  // @gotags: validate:"required,min=1,max=253"
  string hostname = 3;
  // @gotags: validate:"omitempty,max=4096"
  string auth_token = 4;
  // @gotags: validate:"omitempty,max=16"
  string arch = 5;
}

message Heartbeat {
  // @gotags: validate:"omitempty"
  google.protobuf.Duration uptime = 1;
  // @gotags: validate:"omitempty,gte=0,lte=100"
  float cpu_percent = 2;
  // @gotags: validate:"omitempty,gte=0,lte=100"
  float memory_percent = 3;
  // @gotags: validate:"omitempty,gte=0,lte=100"
  float disk_percent = 4;
}

// ============================================================================
// Security Alerts
// ============================================================================

// Security alert types for audit logging
enum SecurityAlertType {
  SECURITY_ALERT_TYPE_UNSPECIFIED = 0;
  // Someone attempted to reassign the agent to a different server
  SECURITY_ALERT_TYPE_SERVER_REASSIGNMENT_ATTEMPT = 1;
  // Credential file tampering detected
  SECURITY_ALERT_TYPE_CREDENTIAL_TAMPERING = 2;
  // Invalid certificate presented
  SECURITY_ALERT_TYPE_INVALID_CERTIFICATE = 3;
}

// Security alert sent from agent to server for audit logging
message SecurityAlert {
  // @gotags: validate:"required,ne=0"
  SecurityAlertType type = 1;
  // @gotags: validate:"required,min=1,max=1024"
  string message = 2;
  // Additional context as key-value pairs
  // @gotags: validate:"omitempty,dive,keys,max=64,endkeys,max=1024"
  map<string, string> details = 3;
}

// ============================================================================
// Server -> Agent
// ============================================================================

message ServerMessage {
  // @gotags: validate:"required,ulid"
  string id = 1;

  oneof payload {
    // @gotags: validate:"omitempty"
    Welcome welcome = 10;
    // @gotags: validate:"omitempty"
    ActionDispatch action = 20;
    // @gotags: validate:"omitempty"
    OSQuery query = 30;
    // @gotags: validate:"omitempty"
    RequestInventory request_inventory = 31;
    // @gotags: validate:"omitempty"
    Error error = 40;
    // LUKS key management responses + instant actions
    // @gotags: validate:"omitempty"
    GetLuksKeyResponse get_luks_key = 50;
    // @gotags: validate:"omitempty"
    StoreLuksKeyResponse store_luks_key = 51;
    // @gotags: validate:"omitempty"
    RevokeLuksDeviceKey revoke_luks_device_key = 52;
    // @gotags: validate:"omitempty"
    StoreLpsPasswordsResponse store_lps_passwords = 53;
    // Log query dispatch (journalctl)
    // @gotags: validate:"omitempty"
    LogQuery log_query = 60;
    // Remote terminal (PTY) session control
    // @gotags: validate:"omitempty"
    TerminalStart terminal_start = 70;
    // @gotags: validate:"omitempty"
    TerminalInput terminal_input = 71;
    // @gotags: validate:"omitempty"
    TerminalResize terminal_resize = 72;
    // @gotags: validate:"omitempty"
    TerminalStop terminal_stop = 73;
  }
}

message Welcome {
  // @gotags: validate:"required,min=1,max=32"
  string server_version = 1;
  // @gotags: validate:"omitempty"
  google.protobuf.Duration heartbeat_interval = 2;
  // Base URL for browser-based device login (configurable, defaults to built-in PM web app).
  // Used by PAM module to open the OIDC login page for display manager sessions.
  string device_login_url = 3;

  // Fields 4-6 removed (old auto-update mechanism, replaced by ACTION_TYPE_AGENT_UPDATE)
  reserved 4, 5, 6;
  reserved "latest_agent_version", "update_url", "update_checksum";
}

message ActionDispatch {
  // Deterministic protobuf wire bytes of the signed SignedActionEnvelope.
  // The agent verifies `signature` over these exact bytes, then unmarshals
  // THESE SAME bytes to execute — the executed message is the verified
  // message. Clean break from carrying a typed Action with a separate
  // params_canonical (sdk#82).
  // @gotags: validate:"required,min=1"
  bytes envelope = 1;
  // CA signature over the `envelope` bytes (control's CA key).
  // @gotags: validate:"required,min=1"
  bytes signature = 2;
}

message Error {
  // @gotags: validate:"required,min=1,max=64"
  string code = 1;
  // @gotags: validate:"required,min=1,max=1024"
  string message = 2;
}

// ============================================================================
// OS Query (osquery-compatible)
// ============================================================================

message OSQuery {
  // @gotags: validate:"required,ulid"
  string query_id = 1;
  // @gotags: validate:"required_without=RawSql,omitempty,min=1,max=64"
  string table = 2;
  // @gotags: validate:"omitempty,dive,max=64"
  repeated string columns = 3;
  // @gotags: validate:"omitempty,dive"
  repeated OSQueryCondition where = 4;
  // @gotags: validate:"omitempty,gte=0,lte=10000"
  int32 limit = 5;
  // Raw SQL query — when set, table/columns/where/limit are ignored.
  // @gotags: validate:"omitempty,max=4096"
  string raw_sql = 6;
  // CA signature over the deterministic wire bytes of this message with
  // signature cleared, under the osquery signing domain. Signed at the
  // control server, relayed opaquely by the gateway, verified fail-closed
  // by the agent before any osquery execution (incl. raw_sql). A compromised
  // gateway/Valkey relay cannot originate or tamper a query under a valid
  // signature.
  // @gotags: validate:"omitempty"
  bytes signature = 7;
  // The single device this query is authorized to run on. Bound INSIDE the
  // signed canonical bytes (signature covers every field but itself), so a
  // compromised gateway/relay cannot replay one device's validly-signed query
  // onto another device that trusts the same CA (PMSEC-001, sibling of
  // SignedActionEnvelope.target_device_id). The agent verifies target ==
  // itself after the signature and refuses otherwise.
  // @gotags: validate:"required,ulid"
  string target_device_id = 8;
}

message OSQueryCondition {
  // @gotags: validate:"required,min=1,max=64"
  string column = 1;
  // @gotags: validate:"required"
  OSQueryOp op = 2;
  // @gotags: validate:"required,max=4096"
  string value = 3;
}

enum OSQueryOp {
  OS_QUERY_OP_UNSPECIFIED = 0;
  OS_QUERY_OP_EQ = 1;
  OS_QUERY_OP_NE = 2;
  OS_QUERY_OP_GT = 3;
  OS_QUERY_OP_LT = 4;
  OS_QUERY_OP_GE = 5;
  OS_QUERY_OP_LE = 6;
  OS_QUERY_OP_LIKE = 7;
  OS_QUERY_OP_GLOB = 8;
}

message OSQueryResult {
  // @gotags: validate:"required,ulid"
  string query_id = 1;
  // @gotags: validate:"omitempty"
  bool success = 2;
  // @gotags: validate:"omitempty,max=1024"
  string error = 3;
  // @gotags: validate:"omitempty,dive"
  repeated OSQueryRow rows = 4;
}

message OSQueryRow {
  // @gotags: validate:"omitempty,dive,keys,max=64,endkeys,max=65536"
  map<string, string> data = 1;
}

// ============================================================================
// Device Inventory (Agent -> Server, cached hardware/software data)
// ============================================================================

message DeviceInventory {
  repeated InventoryTable tables = 1;
}

message InventoryTable {
  // @gotags: validate:"required,min=1,max=64"
  string table_name = 1;
  // @gotags: validate:"omitempty,dive"
  repeated OSQueryRow rows = 2;
}

// Server -> Agent: request fresh inventory collection.
//
// query_id + signature bind a server-originated collection request so a
// compromised gateway cannot make the agent run osquery as root on a forged
// request. Agent-initiated periodic inventory (on connect + every 24h) does
// NOT travel this message and needs no signature — it is the agent's own
// decision, not a relayed command.
message RequestInventory {
  // @gotags: validate:"required,ulid"
  string query_id = 1;
  // CA signature over the deterministic wire bytes of this message with
  // signature cleared, under the inventory signing domain. Verified
  // fail-closed by the agent before any osquery collection.
  // @gotags: validate:"omitempty"
  bytes signature = 2;
  // The single device this collection request is authorized for. Bound INSIDE
  // the signed canonical bytes so a compromised gateway/relay cannot replay one
  // device's validly-signed request onto another (PMSEC-001, sibling of
  // SignedActionEnvelope.target_device_id). The agent verifies target == itself
  // after the signature and refuses otherwise.
  // @gotags: validate:"required,ulid"
  string target_device_id = 3;
}

// ============================================================================
// Standard OS Query Tables
// ============================================================================
//
// os_version: name, version, major, minor, patch, arch, platform, platform_like
// system_info: hostname, cpu_type, cpu_brand, cpu_cores, physical_memory
// kernel_info: version, path
// uptime: days, hours, minutes, seconds, total_seconds
// users: uid, gid, username, directory, shell
// processes: pid, name, path, cmdline, state, uid, parent
// packages: name, version, arch, source
// deb_packages: name, version, arch, status
// rpm_packages: name, version, release, arch
// systemd_units: id, type, load_state, active_state, sub_state
// listening_ports: pid, port, protocol, address
// mounts: device, path, type
// memory_info: memory_total, memory_free, swap_total, swap_free

// ============================================================================
// LUKS Key Management (via stream)
// ============================================================================

// Agent requests the current managed passphrase for a LUKS action.
// device_id is omitted — the gateway knows the device from the mTLS cert.
message GetLuksKeyRequest {
  // @gotags: validate:"required,ulid"
  string action_id = 1;
}

message GetLuksKeyResponse {
  // Bounded like the storage side, so the two halves of the round trip agree on
  // what a passphrase can be.
  //
  // debug_redact marks this field as secret. It does NOT redact anything at
  // runtime: protobuf-go defines the option and no encoder in it consults the
  // option, so the generated String() prints this value like any other. What
  // the annotation buys is a machine-readable marker — TestProtoSecretFieldSinks
  // reads it off the descriptor to derive the set of fields whose plaintext may
  // only be touched at an enumerated sink, so a slog or fmt argument fails the
  // build rather than shipping a credential into a log.
  // @gotags: validate:"required,min=1,max=4096"
  string passphrase = 1 [debug_redact = true];
}

// Agent stores a new managed passphrase on the server.
// The server must confirm receipt before the agent removes the old key from LUKS.
message StoreLuksKeyRequest {
  // @gotags: validate:"required,ulid"
  string action_id = 1;
  // Auto-detected device path (e.g., "/dev/sda2"). Bounded at PATH_MAX: the
  // value is only ever a local block-device path, and without a ceiling an
  // authenticated agent can send a transport-sized string that is validated,
  // encrypted and persisted.
  // @gotags: validate:"required,startswith=/,max=4096"
  string device_path = 2;
  // Managed passphrase, sent over the agent's direct mTLS connection to
  // control. Spec 41 removed the X25519 transport sealing along with the
  // gateway: the seal existed so a relaying gateway could not read
  // disk-encryption secrets (spec 25), and with no relay the agent's TLS
  // terminates at control — the only party that could have opened the blob.
  //
  // What did NOT go with the seal: control encrypts this at rest with
  // AES-256-GCM (sdk crypto.SealWithAAD) under SecretAAD(device, action,
  // "luks"), which is byte-identical to the AAD the transport seal used — so
  // for LUKS the relocation and domain-separation properties carry over exactly.
  // (LPS differs: its transport AAD also bound the username, which the at-rest
  // AAD deliberately omits per ADR 0009. See sdk docs/02-concepts/04-crypto.md.)
  // debug_redact marks this secret for TestProtoSecretFieldSinks; it is not a
  // runtime protection (see GetLuksKeyResponse.passphrase).
  // @gotags: validate:"required,min=1,max=4096"
  string passphrase = 3 [debug_redact = true];
  // Why this rotation happened. INITIAL on the first time the action
  // runs on a device (no previous passphrase to retain); SCHEDULED for
  // any subsequent policy-driven rotation. LUKS does not use
  // AUTH_GRACE — that reason is reserved for LPS, where a user
  // authenticated during the grace period. Validated against the
  // enum at the boundary; the event payload keeps the lowercase
  // string form ("initial" / "scheduled") for backward replay.
  // @gotags: validate:"required,oneof=1 2"
  RotationReason rotation_reason = 4;
}

message StoreLuksKeyResponse {
  bool success = 1;
}

// One password rotation the agent performed during an LPS execution.
//
// Spec 41 moved this onto the agent stream. It previously travelled as
// InternalStoreLpsPasswordsRequest through InternalService/ProxyStoreLpsPasswords
// — the gateway relayed the batch to control — and the password was X25519-sealed
// so that relay could not read it. There is no relay: the agent's mTLS terminates
// at control, which was always the only party able to open the seal.
message LpsPasswordRotation {
  // Local Linux username whose password was rotated.
  // @gotags: validate:"required,min=1,max=64"
  string username = 1;
  // The rotated password, sent over the agent's direct mTLS connection.
  // Control encrypts it at rest on receipt.
  //
  // NOTE, because it is the one property that genuinely changes: the transport
  // seal's AAD bound device|action|username, and the at-rest AAD binds
  // device|action|"lps" with NO username — ADR 0009 omits it deliberately. So
  // control no longer cryptographically verifies that the password it stores
  // under a username is the one the agent generated for that username. That was
  // an end-to-end correctness check, not a confidentiality boundary; a caller
  // authorised to read one username's password on a device already receives all
  // of them. Closing it means adding username to the at-rest AAD, which is ruled
  // separately (spec 41, criterion 8a).
  // debug_redact marks this secret for TestProtoSecretFieldSinks; it is not a
  // runtime protection (see GetLuksKeyResponse.passphrase).
  // @gotags: validate:"required,min=1,max=4096"
  string password = 2 [debug_redact = true];
  // RFC 3339 timestamp the agent observed the rotation. Control keeps the
  // agent's clock here rather than re-stamping at receipt, so the timeline
  // reflects the device's reality.
  //
  // Deliberately NOT format-validated, which is the one exception to the
  // type/format/length/range rule on this message. By the time this arrives the
  // agent has ALREADY changed the passwords locally and cannot undo it, so
  // rejecting the batch over a malformed timestamp destroys the only copy of a
  // credential the operator now needs. The handler normalises what it can and
  // keeps the rotation; length is still bounded.
  // (TestAgentOps_StoreLpsPasswords_PersistsWholeBatch pins this.)
  // @gotags: validate:"required,min=1,max=64"
  string rotated_at = 3;
  // Why this rotation happened. INITIAL the first time the LPS action ran for
  // the user; SCHEDULED for a policy-driven rotation; AUTH_GRACE when a user
  // authenticates during the post-rotation grace window — an LPS-only path that
  // signals "rotate now to limit the leaked-password window", never emitted from
  // LUKS. Stored on the event as the lowercase string form.
  // @gotags: validate:"required,oneof=1 2 3"
  RotationReason reason = 4;
}

// Agent reports the LPS rotations from one execution. Batched per action: an LPS
// run rotates every managed local account on the device.
message StoreLpsPasswordsRequest {
  // @gotags: validate:"required,ulid"
  string action_id = 1;
  // One entry per managed local account on the device. Capped: each entry costs
  // a validation pass, an encryption, and a row, and no real device manages
  // anything near this many accounts.
  // @gotags: validate:"required,min=1,max=256,dive"
  repeated LpsPasswordRotation rotations = 2;
}

message StoreLpsPasswordsResponse {
  bool success = 1;
}

// Server instructs agent to revoke the device-bound key in LUKS slot 7.
// Dispatched as an instant action via the stream.
message RevokeLuksDeviceKey {
  // @gotags: validate:"required,ulid"
  string action_id = 1;
  // CA signature over the deterministic wire bytes of this message with
  // signature cleared, under the LUKS-revoke signing domain. The slot-7
  // device-key wipe is destructive and irreversible, so the agent verifies
  // fail-closed before revoking — a compromised gateway cannot forge or
  // replay a revocation onto any known action_id.
  // @gotags: validate:"omitempty"
  bytes signature = 2;
  // The single device this destructive slot-7 wipe is authorized for. Bound
  // INSIDE the signed canonical bytes so a compromised gateway/relay cannot
  // replay one device's validly-signed revocation onto another that trusts the
  // same CA (PMSEC-001, sibling of SignedActionEnvelope.target_device_id). The
  // agent verifies target == itself after the signature and refuses otherwise.
  // @gotags: validate:"required,ulid"
  string target_device_id = 3;
}

// Agent reports the result of revoking the device-bound key.
message RevokeLuksDeviceKeyResult {
  // @gotags: validate:"required,ulid"
  string action_id = 1;
  bool success = 2;
  // @gotags: validate:"omitempty,max=1024"
  string error = 3;
}

// ============================================================================
// LUKS Token Validation (unary RPC for CLI subcommand)
// ============================================================================

message ValidateLuksTokenRequest {
  // @gotags: validate:"required,ulid"
  string device_id = 1;
  // The one-time token the operator was shown, as issued by
  // ControlService.CreateLuksToken.
  //
  // This was tagged `uuid` — debt from before the repo-wide move to ULIDs, and
  // a shape the issuer never minted. Nothing rejected it because the redemption
  // path did not run the validator; once it did, every legitimate redemption
  // failed. Identifiers here are ULIDs like everywhere else.
  // @gotags: validate:"required,ulid"
  string token = 2;
}

message ValidateLuksTokenResponse {
  string action_id = 1;
  // Auto-detected device path from server's stored key data
  string device_path = 2;
  // Minimum passphrase length (>= 16)
  int32 min_length = 3;
  // Complexity requirement for user-defined passphrases
  LpsPasswordComplexity complexity = 4;
}

// ============================================================================
// Action Sync (Agent pulls assigned actions from server)
// ============================================================================

message SyncActionsRequest {
  // @gotags: validate:"required"
  DeviceId device_id = 1;
}

// ActionGroup represents a set or definition's worth of actions that share a
// single schedule. When the schedule fires, every member action executes in
// the order given. The schedule overrides each member action's own schedule
// field — that field is meaningful only for actions delivered via
// SyncActionsResponse.standalone_actions.
//
// The same action_id may appear at multiple positions within one group (e.g.
// the same action being a member of two sets that compose the same
// definition); idempotent execution absorbs the redundancy. Across groups,
// duplicates are also expected — each group runs independently when its
// schedule fires.
message ActionGroup {
  // Diagnostic label identifying the source of this group, e.g.
  // "definition:<ulid>" or "action_set:<ulid>". For logs and UI only;
  // the agent does not interpret the contents.
  string source_label = 1;

  // Schedule that triggers this group. When fired, every member action runs
  // in order through the existing executor.
  // @gotags: validate:"required"
  ActionSchedule schedule = 2;

  // Member actions in execution order. Each Action's own `schedule` field is
  // ignored — only the group's schedule above applies. The `desired_state`
  // and other fields on each Action are honored as the server resolved them.
  // @gotags: validate:"min=1,dive"
  repeated Action actions = 3;
}

message SyncActionsResponse {
  // The "actions" field (number 1) used to carry every assigned action as a
  // flat list. It is replaced by the split below: standalone_actions for
  // independently-scheduled actions and grouped_actions for set/definition-
  // bound actions that share a single schedule and a defined execution order.
  reserved 1;
  reserved "actions";

  // Effective sync interval in minutes for this device
  // Agent should use this for the next sync interval
  // 0 means use default (30 minutes)
  int32 sync_interval_minutes = 2;

  // Actions assigned directly to this device (or its groups) at the action
  // layer — i.e. not absorbed by a reached set or definition. Each action
  // fires on its own schedule, independent of every other action.
  // The agent should replace its local standalone-action store with this list.
  repeated Action standalone_actions = 3;

  // Action sets / definitions that reach this device, expressed as groups
  // sharing a single schedule each. Each group's actions run in declared
  // order when the group's schedule fires.
  // The agent should replace its local action-group store with this list.
  repeated ActionGroup grouped_actions = 4;

  // Resolved maintenance window. Server-computed union across every
  // group the device belongs to (its own device groups plus any user
  // groups reaching it through an assignment). Empty schedule = no
  // gating; the agent dispatches non-instant actions any time. Empty
  // is also the response when no groups carry a window. The agent
  // evaluates this against time.Now().Local() at dispatch time. See
  // manchtools/power-manage-server#58.
  MaintenanceWindow maintenance_window = 5;

  // Spec 41 removed lps_public_key (field 6) and the LpsPublicKey message. The
  // key was distributed to agents so they could SEAL LPS passwords to control,
  // and was CA-signed specifically so "the relaying gateway cannot substitute
  // its own key". With no gateway there is no substitution risk and no sealing:
  // the agent sends the password over its direct mTLS connection to control,
  // which encrypts it at rest. Distributing a sealing key to a party that no
  // longer seals is dead contract.
  //
  // Field number 6 is NOT reserved — V1 is the only wire version and clean
  // breaks are the rule here, so it may be reused.
}

// ============================================================================
// Log Query (Remote journalctl)
// ============================================================================

// LogSource selects which system log source the agent queries.
// JOURNALD is the default and is what current agents implement;
// SYSLOG slots in for openrc/syslog-ng/rsyslog systems (Alpine, Void,
// legacy Debian/RHEL). Agents must report a clear "source not
// supported on this device" error when asked for a source they can't
// serve.
enum LogSource {
  LOG_SOURCE_JOURNALD = 0; // default — journalctl
  LOG_SOURCE_SYSLOG = 1; // syslog files in /var/log (rsyslog, syslog-ng, busybox syslog)
}

// Server -> Agent: request system log output
message LogQuery {
  // @gotags: validate:"required,ulid"
  string query_id = 1;
  // @gotags: validate:"omitempty,gte=0,lte=10000"
  int32 lines = 2;
  // @gotags: validate:"omitempty,max=256"
  string unit = 3;
  // @gotags: validate:"omitempty,max=64"
  string since = 4;
  // @gotags: validate:"omitempty,max=64"
  string until = 5;
  // @gotags: validate:"omitempty,max=32"
  string priority = 6;
  // @gotags: validate:"omitempty,max=256"
  string grep = 7;
  bool kernel = 8;
  // Log source. Defaults to LOG_SOURCE_JOURNALD. Agents without
  // support for a requested source return an error.
  // @gotags: validate:"omitempty"
  LogSource source = 9;
  // CA signature over the deterministic wire bytes of this message with
  // signature cleared, under the logquery signing domain. journalctl runs as
  // root, so the agent verifies fail-closed before building any journalctl
  // invocation — a compromised gateway cannot originate or retarget
  // (e.g. swap the unit) a log read under a valid signature.
  // @gotags: validate:"omitempty"
  bytes signature = 10;
  // The single device this log read is authorized for. Bound INSIDE the signed
  // canonical bytes so a compromised gateway/relay cannot replay one device's
  // validly-signed log query onto another that trusts the same CA (PMSEC-001,
  // sibling of SignedActionEnvelope.target_device_id). The agent verifies
  // target == itself after the signature and refuses otherwise.
  // @gotags: validate:"required,ulid"
  string target_device_id = 11;
}

// Agent -> Server: journalctl output result
message LogQueryResult {
  // @gotags: validate:"required,ulid"
  string query_id = 1;
  bool success = 2;
  // @gotags: validate:"omitempty,max=1024"
  string error = 3;
  // Raw journalctl output (plain text)
  string logs = 4;
}

// ============================================================================
// Remote Terminal (PTY) Sessions
// ============================================================================
//
// Terminal sessions flow over the existing bidirectional Stream RPC. The
// gateway is the source of truth for active sessions: it bridges WebSocket
// traffic from the web client to the agent and tees stdin to the
// control:inbox queue for audit. Stdout is NOT audited (high volume).
//
// cols/rows use uint32 because proto3 has no uint16. Validation caps both
// at 65535 (the underlying TIOCSWINSZ ioctl uses unsigned shorts).

// Terminal session lifecycle states reported by the agent.
enum TerminalSessionState {
  TERMINAL_SESSION_STATE_UNSPECIFIED = 0;
  // PTY allocated and the shell is running.
  TERMINAL_SESSION_STATE_STARTED = 1;
  // Shell exited cleanly; exit_code is set.
  TERMINAL_SESSION_STATE_EXITED = 2;
  // Session ended with an error (auth, missing TTY user, PTY alloc, etc.);
  // error is populated.
  TERMINAL_SESSION_STATE_ERROR = 3;
}

// Server -> Agent: open a PTY session as the given TTY user.
// The agent must verify that tty_user exists locally and is not disabled
// before allocating the PTY. The shell is activated for the duration of
// the session and reverted to nologin on disconnect.
message TerminalStart {
  // @gotags: validate:"required,ulid"
  string session_id = 1;
  // The dedicated TTY username (e.g. "pm-tty-pdotterer"). The agent
  // never uses the original Linux username for the shell.
  // @gotags: validate:"required,min=1,max=64"
  string tty_user = 2;
  // @gotags: validate:"required,gt=0,lte=65535"
  uint32 cols = 3;
  // @gotags: validate:"required,gt=0,lte=65535"
  uint32 rows = 4;
}

// Server -> Agent: stdin data for an active session.
message TerminalInput {
  // @gotags: validate:"required,ulid"
  string session_id = 1;
  // @gotags: validate:"required,max=65536"
  bytes data = 2;
}

// Server -> Agent: window resize.
// The agent forwards the new size to the PTY via TIOCSWINSZ.
message TerminalResize {
  // @gotags: validate:"required,ulid"
  string session_id = 1;
  // @gotags: validate:"required,gt=0,lte=65535"
  uint32 cols = 2;
  // @gotags: validate:"required,gt=0,lte=65535"
  uint32 rows = 3;
}

// Server -> Agent: terminate an active session.
// The agent SIGTERMs the shell process group and reverts the user's
// shell to nologin. The optional reason is propagated end-to-end from
// ControlService.TerminateTerminalSession through
// GatewayService.TerminateGatewayTerminalSession so the agent can
// surface it in logs and the audit trail captures why the session
// was killed.
message TerminalStop {
  // @gotags: validate:"required,ulid"
  string session_id = 1;
  // @gotags: validate:"omitempty,max=512"
  string reason = 2;
}

// Agent -> Server: stdout/stderr data from the PTY.
message TerminalOutput {
  // @gotags: validate:"required,ulid"
  string session_id = 1;
  // @gotags: validate:"required,max=65536"
  bytes data = 2;
}

// Agent -> Server: session state transition.
// STARTED is sent immediately after the PTY is allocated and the shell
// has begun. EXITED is sent when the shell process exits cleanly, with
// exit_code populated. ERROR is sent for any failure that ends the
// session early, with error populated.
message TerminalStateChange {
  // @gotags: validate:"required,ulid"
  string session_id = 1;
  // @gotags: validate:"required,ne=0"
  TerminalSessionState state = 2;
  // Set when state is EXITED.
  int32 exit_code = 3;
  // Set when state is ERROR.
  // @gotags: validate:"omitempty,max=1024"
  string error = 4;
}
